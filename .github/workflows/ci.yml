name: CI

on:
  push:
    # `fix/xss-jsonld` : branche de travail du chantier mobile-generation
    # (D-014) -- la CI doit verifier l'etat REEL de la branche, pas seulement
    # les PR de release vers main. Le rapport de sante ne verifie les
    # invariants base QUE sur main (voir report-system-health.ts).
    branches: [main, fix/xss-jsonld]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # D-014 (monorepo) : l'app vit dans apps/web. `npm ci` s'execute a la
    # RACINE (lockfile workspace unique) ; toutes les autres commandes
    # s'executent dans apps/web -- y compris les 4 cliquets qui dependent de
    # process.cwd(), et le rapport de sante qui lit vitest-results.json
    # depuis le cwd.
    defaults:
      run:
        working-directory: apps/web
    # `next build` instancie certains clients (Supabase, Stripe, OpenAI, Resend) au
    # chargement de module pour quelques routes API. Ces valeurs ne sont jamais
    # utilisées pour un vrai appel réseau pendant le build — elles servent
    # uniquement à satisfaire les constructeurs. Aucun secret réel n'est requis ici.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key-for-ci
      STRIPE_SECRET_KEY: sk_test_placeholder
      OPENAI_API_KEY: sk-placeholder
      RESEND_API_KEY: re_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        working-directory: .

      # continue-on-error + id sur les 3 étapes bloquantes : on a besoin que
      # l'étape "Report system health" tourne même si l'une d'elles échoue
      # (sinon un échec ne serait jamais remonté à l'Admin). Le vrai gate
      # est l'étape "Gate" tout en bas, qui échoue explicitement le job si
      # l'une de ces 3 étapes n'a pas réussi — le comportement bloquant du
      # Bloc 1 est donc préservé, pas affaibli.
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Test
        id: test
        continue-on-error: true
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Build
        id: build
        continue-on-error: true
        run: npx next build

      # Non-bloquant pour l'instant : 699 problèmes ESLint pré-existants dans le
      # projet (hors périmètre de ce chantier). Bloquer la CI dessus la rendrait
      # rouge dès le premier commit pour une dette non liée aux changements en
      # cours. À rendre bloquant une fois cette dette traitée séparément.
      # M1-R3 -- CAUSE RACINE de la derive documentaire : ce script existait,
      # etait correct et bidirectionnel, mais n'etait LANCE NULLE PART. Sept
      # routes ont donc pu s'ajouter sans entree de documentation, en silence.
      # Corriger la documentation sans cabler le garde aurait garanti le retour
      # de la derive.
      #
      # Bloquant, contrairement au lint : la verification est deterministe,
      # instantanee, sans dette pre-existante (0 ecart au moment du cablage), et
      # sa correction est evidente -- documenter la route qu'on vient d'ajouter.
      - name: API docs coverage
        id: apidocs
        continue-on-error: true
        run: node scripts/check-api-docs.mjs

      - name: Lint (informatif, non bloquant)
        run: npx eslint .
        continue-on-error: true

      # Paquets du moteur (packages/*) : contrairement au lint de apps/web,
      # le lint des paquets est BLOQUANT dès le premier commit (règle
      # packages/README.md — la dette lint existante ne s'hérite pas).
      # continue-on-error + id comme les étapes web : le vrai gate est
      # l'étape "Gate" finale, pour que "Report system health" tourne
      # toujours.
      - name: Packages — typecheck
        id: pkg_typecheck
        continue-on-error: true
        working-directory: .
        run: npm run packages:typecheck

      - name: Packages — lint (bloquant)
        id: pkg_lint
        continue-on-error: true
        working-directory: .
        run: npm run packages:lint

      - name: Packages — test
        id: pkg_test
        continue-on-error: true
        working-directory: .
        run: npm run packages:test

      # Remonte le résultat de ce run vers l'Admin Deribfy (/admin/system-health).
      # Purement informatif : n'affecte jamais l'issue du job (voir le script
      # lui-même — il ne sort jamais en erreur). SUPABASE_SERVICE_ROLE_KEY doit
      # être ajoutée comme secret du repository GitHub (Settings > Secrets and
      # variables > Actions) — valeur réelle, PAS le placeholder utilisé plus
      # haut pour le build. NEXT_PUBLIC_SUPABASE_URL n'est pas un secret (valeur
      # publique, déjà exposée côté client) : elle est donc écrite en clair ici.
      - name: Report system health
        if: always()
        env:
          SUPABASE_URL: https://lefumezaxfsttigpmzhr.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-system-health.ts

      - name: Gate — échoue si une étape bloquante a échoué
        if: always()
        run: |
          if [ "${{ steps.typecheck.outcome }}" != "success" ] || [ "${{ steps.test.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ] || [ "${{ steps.apidocs.outcome }}" != "success" ] || [ "${{ steps.pkg_typecheck.outcome }}" != "success" ] || [ "${{ steps.pkg_lint.outcome }}" != "success" ] || [ "${{ steps.pkg_test.outcome }}" != "success" ]; then
            echo "Étape(s) en échec — typecheck=${{ steps.typecheck.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }} apidocs=${{ steps.apidocs.outcome }} pkg_typecheck=${{ steps.pkg_typecheck.outcome }} pkg_lint=${{ steps.pkg_lint.outcome }} pkg_test=${{ steps.pkg_test.outcome }}"
            exit 1
          fi
          echo "Toutes les étapes bloquantes ont réussi."
