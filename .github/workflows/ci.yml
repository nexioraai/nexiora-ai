name: CI

on:
  push:
    # Branches de travail du chantier mobile-generation -- la CI doit verifier
    # l'etat REEL de la branche, pas seulement les PR de release vers main. Le
    # rapport de sante ne verifie les invariants base QUE sur main (voir
    # report-system-health.ts).
    #
    # A-P0-01 (audit 2026-08-31) : `feat/mobile-generation` manquait. Le
    # chantier a ete renomme de branche sans que ce declencheur suive, et
    # 97 commits -- dont les 5 nouveaux paquets slots, repair,
    # provider-registry, execution-contract et fidelity -- n'ont JAMAIS ete
    # vus par la CI depuis le 2026-08-27. Le critere de sortie « CI verte » de
    # la Phase 0 etait donc invérifiable sur le travail reel.
    # `fix/xss-jsonld` est conservee : elle porte encore l'historique publie.
    branches: [main, fix/xss-jsonld, feat/mobile-generation]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # D-014 (monorepo) : l'app vit dans apps/web. `npm ci` s'execute a la
    # RACINE (lockfile workspace unique) ; toutes les autres commandes
    # s'executent dans apps/web -- y compris les 4 cliquets qui dependent de
    # process.cwd(), et le rapport de sante qui lit vitest-results.json
    # depuis le cwd.
    defaults:
      run:
        working-directory: apps/web
    # `next build` instancie certains clients (Supabase, Stripe, OpenAI, Resend) au
    # chargement de module pour quelques routes API. Ces valeurs ne sont jamais
    # utilisées pour un vrai appel réseau pendant le build — elles servent
    # uniquement à satisfaire les constructeurs. Aucun secret réel n'est requis ici.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key-for-ci
      STRIPE_SECRET_KEY: sk_test_placeholder
      OPENAI_API_KEY: sk-placeholder
      RESEND_API_KEY: re_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        working-directory: .

      # continue-on-error + id sur les 3 étapes bloquantes : on a besoin que
      # l'étape "Report system health" tourne même si l'une d'elles échoue
      # (sinon un échec ne serait jamais remonté à l'Admin). Le vrai gate
      # est l'étape "Gate" tout en bas, qui échoue explicitement le job si
      # l'une de ces 3 étapes n'a pas réussi — le comportement bloquant du
      # Bloc 1 est donc préservé, pas affaibli.
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Test
        id: test
        continue-on-error: true
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Build
        id: build
        continue-on-error: true
        run: npx next build

      # Non-bloquant pour l'instant : 699 problèmes ESLint pré-existants dans le
      # projet (hors périmètre de ce chantier). Bloquer la CI dessus la rendrait
      # rouge dès le premier commit pour une dette non liée aux changements en
      # cours. À rendre bloquant une fois cette dette traitée séparément.
      # M1-R3 -- CAUSE RACINE de la derive documentaire : ce script existait,
      # etait correct et bidirectionnel, mais n'etait LANCE NULLE PART. Sept
      # routes ont donc pu s'ajouter sans entree de documentation, en silence.
      # Corriger la documentation sans cabler le garde aurait garanti le retour
      # de la derive.
      #
      # Bloquant, contrairement au lint : la verification est deterministe,
      # instantanee, sans dette pre-existante (0 ecart au moment du cablage), et
      # sa correction est evidente -- documenter la route qu'on vient d'ajouter.
      - name: API docs coverage
        id: apidocs
        continue-on-error: true
        run: node scripts/check-api-docs.mjs

      - name: Lint (informatif, non bloquant)
        run: npx eslint .
        continue-on-error: true

      # Paquets du moteur (packages/*) : contrairement au lint de apps/web,
      # le lint des paquets est BLOQUANT dès le premier commit (règle
      # packages/README.md — la dette lint existante ne s'hérite pas).
      # continue-on-error + id comme les étapes web : le vrai gate est
      # l'étape "Gate" finale, pour que "Report system health" tourne
      # toujours.
      - name: Packages — typecheck
        id: pkg_typecheck
        continue-on-error: true
        working-directory: .
        run: npm run packages:typecheck

      - name: Packages — lint (bloquant)
        id: pkg_lint
        continue-on-error: true
        working-directory: .
        run: npm run packages:lint

      - name: Packages — test
        id: pkg_test
        continue-on-error: true
        working-directory: .
        run: npm run packages:test

      # GATES RACINE (D-072) — les tests de paquets verifient le TEXTE emis.
      # Le 2026-08-31, 659 tests etaient verts pendant que 11 applications sur
      # 14 NE COMPILAIENT PAS. Corriger les types etait couper une tete ; la
      # racine etait l'absence de ces deux gates. Elles compilent et rendent
      # REELLEMENT chaque application du corpus.
      - name: Apps emises — compilent
        id: app_compile
        continue-on-error: true
        working-directory: .
        run: npm run gate:app-compile

      # MONTE reellement les 58 ecrans des 14 applications (react-test-renderer
      # + stubs RN). La premiere version de cette gate s'appelait « se rendent »
      # et se contentait de LIRE les modules de donnees : elle SURDECLARAIT,
      # exactement le defaut qu'elle existe pour attraper.
      - name: Apps emises — se rendent
        id: app_rendu
        continue-on-error: true
        working-directory: .
        run: npm run gate:app-rendu

      # Remonte le résultat de ce run vers l'Admin Deribfy (/admin/system-health).
      # Purement informatif : n'affecte jamais l'issue du job (voir le script
      # lui-même — il ne sort jamais en erreur). SUPABASE_SERVICE_ROLE_KEY doit
      # être ajoutée comme secret du repository GitHub (Settings > Secrets and
      # variables > Actions) — valeur réelle, PAS le placeholder utilisé plus
      # haut pour le build. NEXT_PUBLIC_SUPABASE_URL n'est pas un secret (valeur
      # publique, déjà exposée côté client) : elle est donc écrite en clair ici.
      # CLIQUET DES CONTROLES FANTOMES (D-084) — presse chaque controle des
      # 26 applications et exige qu'il PRODUISE un effet observable. Les deux
      # gates precedentes verifient que l'app compile et se rend ; aucune ne
      # verifiait qu'un bouton AGIT — c'est pourtant le defaut fondateur du
      # chantier (APP-D002) et il venait de se reproduire a l'identique.
      - name: Apps emises — aucun controle fantome nouveau
        id: app_controles
        continue-on-error: true
        working-directory: .
        run: npm run gate:controles

      # GATE NAVIGATION (D-086) — empeche le retour des destinations globales
      # transformees en gros boutons dans le contenu. Cliquet a 121, la mesure
      # reelle : un plafond au-dessus de l'etat mesure ne mord pas.
      - name: Apps emises — session (Phase 4)
        id: app_session
        continue-on-error: true
        working-directory: .
        run: npm run gate:session

      - name: Apps emises — navigation principale
        id: app_navigation
        continue-on-error: true
        working-directory: .
        run: npm run gate:navigation

      # GATE COMPOSITION (D-087) — une image declaree et jamais affichee est un
      # defaut. Cliquet a 40, la mesure reelle sur les deux corpus.
      - name: Apps emises — composition
        id: app_composition
        continue-on-error: true
        working-directory: .
        run: npm run gate:composition

      # D-088 · D5 — PHASE 10B ENFIN CÂBLÉE. `evaluatePromises` et
      # `evaluateIntentCoverage` existaient, étaient testés, étaient déclarés
      # SATISFAITS dans la ROADMAP -- et n'etaient appeles par AUCUNE gate.
      # Les cinq gates precedentes mesurent le MOTEUR ; celle-ci mesure la
      # FIDELITE : le document tient-il ce que la demande exprimait ?
      # D (arbitrage 2026-09-04, D-134) — POLITIQUE CI, PAS une exigence
      # réécrite. Cette gate s'exécute INTÉGRALEMENT et publie TOUT (F1, F4,
      # motifs réfutés, rapport document par document) ; son verdict et son
      # `exit 1` sont inchangés. Seul son caractère BLOQUANT est suspendu sur
      # les branches de chantier, où le rouge résiduel est composé de dettes
      # ARBITRÉES : 12 documents v2 gelés (promesses mortes réelles, corpus
      # non retouchable) + 3 documents v3 DIFFÉRÉS par D-125. Elle reste
      # BLOQUANTE sur `main` et sur toute pull_request vers `main`.
      # RETOUR AU CARACTÈRE BLOQUANT (condition explicite) : régénération des
      # 3 documents différés ET décision propriétaire sur le corpus v2 gelé.
      - name: Apps emises — fidelite (F1/F4/F5) — bloquante sur main et PR
        id: app_fidelite
        continue-on-error: true
        working-directory: .
        run: npm run gate:fidelite

      # D-102 — HARNAIS D'INVARIANTS. Deux defauts d'oracle ont ete payes par des
      # generations API (P5, P6) ; il a ete DEMONTRE que celui de P6 etait
      # detectable ici, gratuitement, sur des documents deja presents.
      - name: Oracles — harnais d'invariants
        id: app_invariants
        continue-on-error: true
        working-directory: .
        run: npm run gate:invariants

      - name: Report system health
        if: always()
        env:
          SUPABASE_URL: https://lefumezaxfsttigpmzhr.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-system-health.ts

      - name: Gate — échoue si une étape bloquante a échoué
        if: always()
        env:
          # `main` et les pull_request vers `main` restent gouvernées par la
          # fidélité ; les push de branches de chantier ne le sont plus (D-134).
          FIDELITE_BLOQUANTE: ${{ github.ref_name == 'main' || github.event_name == 'pull_request' }}
        run: |
          # Un échec de fidélité est TOUJOURS signalé, qu'il bloque ou non —
          # aucune donnée masquée, aucun silence (règle 3 de l'arbitrage).
          if [ "${{ steps.app_fidelite.outcome }}" != "success" ]; then
            echo "🔴 FIDÉLITÉ EN ÉCHEC (app_fidelite=${{ steps.app_fidelite.outcome }}) — le rapport complet est publié ci-dessus."
            echo "   Dette ARBITRÉE : 12 documents v2 gelés (F1, promesses mortes réelles) + 3 documents v3 différés (D-125)."
            echo "   BLOQUANT ici ? ${FIDELITE_BLOQUANTE} (bloquant sur main et pull_request ; non bloquant sur les branches de chantier — D-134)."
          fi
          fidelite_ko=false
          if [ "${FIDELITE_BLOQUANTE}" = "true" ] && [ "${{ steps.app_fidelite.outcome }}" != "success" ]; then
            fidelite_ko=true
          fi
          if [ "$fidelite_ko" = "true" ] || [ "${{ steps.typecheck.outcome }}" != "success" ] || [ "${{ steps.test.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ] || [ "${{ steps.apidocs.outcome }}" != "success" ] || [ "${{ steps.pkg_typecheck.outcome }}" != "success" ] || [ "${{ steps.pkg_lint.outcome }}" != "success" ] || [ "${{ steps.pkg_test.outcome }}" != "success" ] || [ "${{ steps.app_compile.outcome }}" != "success" ] || [ "${{ steps.app_rendu.outcome }}" != "success" ] || [ "${{ steps.app_controles.outcome }}" != "success" ] || [ "${{ steps.app_session.outcome }}" != "success" ] || [ "${{ steps.app_navigation.outcome }}" != "success" ] || [ "${{ steps.app_composition.outcome }}" != "success" ] || [ "${{ steps.app_invariants.outcome }}" != "success" ]; then
            echo "Étape(s) en échec — typecheck=${{ steps.typecheck.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }} apidocs=${{ steps.apidocs.outcome }} pkg_typecheck=${{ steps.pkg_typecheck.outcome }} pkg_lint=${{ steps.pkg_lint.outcome }} pkg_test=${{ steps.pkg_test.outcome }} app_compile=${{ steps.app_compile.outcome }} app_rendu=${{ steps.app_rendu.outcome }} app_controles=${{ steps.app_controles.outcome }} app_session=${{ steps.app_session.outcome }} app_navigation=${{ steps.app_navigation.outcome }} app_composition=${{ steps.app_composition.outcome }} app_fidelite=${{ steps.app_fidelite.outcome }} app_invariants=${{ steps.app_invariants.outcome }}"
            exit 1
          fi
          echo "Toutes les étapes bloquantes ont réussi."
