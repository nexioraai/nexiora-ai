version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Prisma disparaitra avec le debranchement de src/erp/ : on ignore ses
    # updates pour eviter les PR recurrentes (breaking change v7) en attendant.
    ignore:
      - dependency-name: "prisma"
      - dependency-name: "@prisma/client"
