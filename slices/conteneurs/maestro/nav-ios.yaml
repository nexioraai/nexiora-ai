# GÉNÉRÉ DEPUIS L'AIR (prj_transit_abidjan_tracking) — navigation LTR. NE PAS ÉDITER.
appId: com.deribfy.preview.suivi-conteneurs-abidjan
---
- launchApp
- assertVisible:
    id: "scr_conteneurs"
- assertVisible:
    id: "blk_conteneurs_liste-row-ent_conteneur_row_1"
- scrollUntilVisible:
    element:
      id: "blk_conteneurs_ajouter"
    timeout: 60000
    speed: 70
- tapOn:
    id: "blk_conteneurs_ajouter"
- assertVisible:
    id: "scr_suivi_ajout"
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 400
- assertVisible:
    id: "scr_conteneurs"
