# GÉNÉRÉ DEPUIS L'AIR — rejeu RTL (rtlSupported=false).
appId: com.deribfy.preview.maquis-express
---
- launchApp:
    arguments:
      forceRTL: true
- assertVisible:
    id: "scr_menu"
- assertVisible:
    id: "blk_menu_liste-row-ent_plat_row_1"
- scrollUntilVisible:
    element:
      id: "blk_menu_bouton_commandes"
    timeout: 60000
    speed: 70
- tapOn:
    id: "blk_menu_bouton_commandes"
- assertVisible:
    id: "scr_commandes"
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 400
- assertVisible:
    id: "scr_menu"
- scrollUntilVisible:
    element:
      id: "blk_menu_bouton_panier"
    timeout: 60000
    speed: 70
- tapOn:
    id: "blk_menu_bouton_panier"
- assertVisible:
    id: "scr_panier"
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 400
- assertVisible:
    id: "scr_menu"
