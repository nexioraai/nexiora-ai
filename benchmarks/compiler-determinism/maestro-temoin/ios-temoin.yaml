# 4.7 — APP TÉMOIN iOS : lancement, fixtures rendues, action navigate
# réelle (bouton), retour système. Captures versionnées.
appId: com.deribfy.preview.maquis-express
---
- launchApp
- assertVisible:
    id: "scr_menu"
- assertVisible:
    id: "blk_menu_liste-row-ent_plat_row_1"
- takeScreenshot: temoin-ios-menu
- scrollUntilVisible:
    element:
      id: "blk_menu_bouton_panier"
- tapOn:
    id: "blk_menu_bouton_panier"
- assertVisible:
    id: "scr_panier"
- takeScreenshot: temoin-ios-panier
- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 400
- assertVisible:
    id: "scr_menu"
